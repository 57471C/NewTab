name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Pack dist
        run: |
          mv dist NewTab
          zip -r "NewTab-${GITHUB_REF_NAME}.zip" NewTab

      - uses: softprops/action-gh-release@v2
        with:
          files: NewTab-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            Unzip, then in Brave/Chrome/Edge: Developer mode → Load unpacked → select the `NewTab` folder.

            Do not load the repo root. Friends use their own API keys.
